{% extends 'layout.html' %}
{% block body_content %}
<h1> Features </h1>

<table>
    <th>
    <td>Feature Name</td>
    </th>
    {% if (features|length)>0 %}
        {% for feature in features %}
        <tr>
            <td>{{feature.feature_id}}</td>
            <td><a href="{{url_for('feature_update', feature_id = feature.feature_id)}}">{{feature.featurename}}</a></td>
        </tr>
        {% endfor %}
    {% endif %}
</table>

<a href="{{url_for('feature_create')}}">New Feature </a>

{% endblock body_content %}
